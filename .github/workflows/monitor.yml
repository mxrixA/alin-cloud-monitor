name: ALin API diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test ALin API flow
        env:
          ALIN_EMAIL: ${{ secrets.ALIN_EMAIL }}
          ALIN_PASSWORD: ${{ secrets.ALIN_PASSWORD }}
        run: |
          AUTH_PAYLOAD=$(jq -nc --arg login "$ALIN_EMAIL" --arg password "$ALIN_PASSWORD" '{login:$login,password:$password}')
          AUTH_JSON=$(curl --silent --show-error --fail --request POST 'https://api.be-ys.com/als-back/v1/accounts/authenticate' --header 'Content-Type: application/json' --header 'X-GeXRT-API-Key: 7d6bfa55-4632-41ed-bddd-597866ebbfb5' --data "$AUTH_PAYLOAD")
          ACCESS_TOKEN=$(printf '%s' "$AUTH_JSON" | jq -r '.access_token // empty')
          test -n "$ACCESS_TOKEN" || { echo 'ALin authentication returned no access token'; exit 1; }
          echo "::add-mask::$ACCESS_TOKEN"

          EXCHANGE_PAYLOAD=$(jq -nc --arg token "$ACCESS_TOKEN" '{access_token:$token}')
          EXCHANGE_JSON=$(curl --silent --show-error --fail --request POST 'https://api.al-in.fr/api/token_exchange/als_hermes_salarie' --header 'Content-Type: application/json' --data "$EXCHANGE_PAYLOAD")
          JWT_TOKEN=$(printf '%s' "$EXCHANGE_JSON" | jq -r '.jwt_token // empty')
          test -n "$JWT_TOKEN" || { echo 'ALin token exchange returned no JWT'; exit 1; }
          echo "::add-mask::$JWT_TOKEN"

          TODAY=$(date -u +%F)
          YESTERDAY=$(date -u -d 'yesterday' +%F)
          curl --silent --show-error --fail --get 'https://api.al-in.fr/api/dmo/housing_offers' --header "Authorization: Bearer $JWT_TOKEN" --data-urlencode 'per_page=100' --data-urlencode 'page=1' --data-urlencode "publication_end_date[$gte]=$YESTERDAY" --data-urlencode "date_publication_start[$lte]=$TODAY" --output /tmp/offers.json
          COUNT=$(jq '.data | length' /tmp/offers.json)
          echo "ALIN_API_OK offers_returned=$COUNT"
