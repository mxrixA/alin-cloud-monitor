name: ALin offer monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Resume after fixing an authentication problem'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alin-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Check ALin offers
        env:
          ALIN_EMAIL: ${{ secrets.ALIN_EMAIL }}
          ALIN_PASSWORD: ${{ secrets.ALIN_PASSWORD }}
          ALIN_OFFERS_URL: ${{ secrets.ALIN_OFFERS_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEADLESS: '1'
          FORCE_RESUME: ${{ inputs.resume && '1' || '0' }}
        run: python monitor.py

      - name: Persist anonymous monitor state
        if: always()
        run: |
          git config user.name "alin-monitor[bot]"
          git config user.email "alin-monitor-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update monitor state [skip ci]"
            git push
          fi
